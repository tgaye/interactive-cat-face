<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Cat Face</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .instructions:hover {
            opacity: 1;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.8.0/lib/p5.js"></script>

<base target="_self">


    <div id="canvas-container">
        <div class="instructions">Click or drag to create cats<br>Press any key to clear</div>
    </div>

    <script>
        const sketch = (p) => {
            let cats = [];
            let catColors = [
                '#FFBE0B', '#FB5607', '#FF006E', 
                '#8338EC', '#3A86FF', '#4CC9F0'
            ];
            let bgColor = '#F8F9FA';
            let eyeState = 0;
            let lastBlink = 0;

            p.setup = () => {
                let canvas = p.createCanvas(800, 600);
                canvas.parent('canvas-container');
                p.background(bgColor);
                p.noStroke();
                p.rectMode(p.CENTER);
                p.ellipseMode(p.CENTER);
                
                // Create initial cat
                cats.push(createCat(p.width/2, p.height/2, 150));
            };

            function createCat(x, y, size) {
                let colorIndex = p.floor(p.random(catColors.length));
                let baseColor = p.color(catColors[colorIndex]);
                let earColor = p.lerpColor(baseColor, p.color(0), 0.2);
                let eyeColor = p.color(p.random(50, 200), p.random(50, 200), p.random(150, 255));
                
                return {
                    x: x,
                    y: y,
                    size: size,
                    baseColor: baseColor,
                    earColor: earColor,
                    eyeColor: eyeColor,
                    angle: p.random(p.TWO_PI),
                    speed: p.random(0.5, 2),
                    isMoving: false,
                    targetX: x,
                    targetY: y,
                    blinkTimer: p.floor(p.random(60, 180)),
                    lastBlink: 0,
                    whiskerAngle: 0,
                    tailAngle: 0,
                    mood: p.random([0, 1, 2]) // 0=neutral, 1=happy, 2=grumpy
                };
            }

            p.draw = () => {
                p.background(bgColor);
                
                // Update all cats
                for (let i = 0; i < cats.length; i++) {
                    let cat = cats[i];
                    
                    // Movement logic
                    if (cat.isMoving) {
                        let dx = cat.targetX - cat.x;
                        let dy = cat.targetY - cat.y;
                        let dist = p.sqrt(dx*dx + dy*dy);
                        
                        if (dist > 5) {
                            cat.x += dx * 0.05;
                            cat.y += dy * 0.05;
                            cat.angle = p.atan2(dy, dx);
                        } else {
                            cat.isMoving = false;
                        }
                    }
                    
                    // Blinking logic
                    cat.lastBlink++;
                    if (cat.lastBlink > cat.blinkTimer) {
                        cat.lastBlink = 0;
                        cat.blinkTimer = p.floor(p.random(60, 180));
                    }
                    
                    // Animation states
                    cat.whiskerAngle = p.sin(p.frameCount * 0.05) * 0.2;
                    cat.tailAngle = p.sin(p.frameCount * 0.03) * 0.5;
                    
                    // Draw cat
                    drawCat(cat);
                }
            };

            function drawCat(cat) {
                p.push();
                p.translate(cat.x, cat.y);
                p.rotate(cat.angle);
                
                // Body
                p.fill(cat.baseColor);
                p.ellipse(0, 0, cat.size, cat.size * 0.9);
                
                // Ears
                p.fill(cat.earColor);
                p.triangle(
                    -cat.size * 0.3, -cat.size * 0.4,
                    -cat.size * 0.15, -cat.size * 0.7,
                    0, -cat.size * 0.45
                );
                p.triangle(
                    cat.size * 0.3, -cat.size * 0.4,
                    cat.size * 0.15, -cat.size * 0.7,
                    0, -cat.size * 0.45
                );
                
                // Face
                p.fill(255, 230, 200);
                p.ellipse(0, 0, cat.size * 0.7, cat.size * 0.6);
                
                // Eyes
                let eyeOpen = 1;
                if (cat.lastBlink < 5) {
                    eyeOpen = p.map(cat.lastBlink, 0, 5, 0.1, 1);
                } else if (cat.lastBlink > cat.blinkTimer - 5) {
                    eyeOpen = p.map(cat.lastBlink, cat.blinkTimer - 5, cat.blinkTimer, 1, 0.1);
                }
                
                p.fill(255);
                p.ellipse(-cat.size * 0.15, -cat.size * 0.05, cat.size * 0.15, cat.size * 0.15 * eyeOpen);
                p.ellipse(cat.size * 0.15, -cat.size * 0.05, cat.size * 0.15, cat.size * 0.15 * eyeOpen);
                
                p.fill(cat.eyeColor);
                let pupilSize = cat.size * 0.05;
                p.ellipse(-cat.size * 0.15, -cat.size * 0.05, pupilSize, pupilSize * eyeOpen);
                p.ellipse(cat.size * 0.15, -cat.size * 0.05, pupilSize, pupilSize * eyeOpen);
                
                // Nose
                p.fill(255, 150, 150);
                p.triangle(
                    0, 0,
                    -cat.size * 0.05, cat.size * 0.05,
                    cat.size * 0.05, cat.size * 0.05
                );
                
                // Mouth
                p.stroke(0);
                p.strokeWeight(1);
                p.noFill();
                if (cat.mood === 0) {
                    p.line(0, cat.size * 0.05, 0, cat.size * 0.1);
                } else if (cat.mood === 1) {
                    p.arc(0, cat.size * 0.08, cat.size * 0.1, cat.size * 0.05, 0, p.PI);
                } else {
                    p.arc(0, cat.size * 0.12, cat.size * 0.1, cat.size * 0.05, p.PI, p.TWO_PI);
                }
                p.noStroke();
                
                // Whiskers
                p.stroke(150);
                p.strokeWeight(1);
                for (let i = -1; i <= 1; i += 2) {
                    p.line(
                        i * cat.size * 0.05, cat.size * 0.05,
                        i * cat.size * 0.25, cat.size * 0.05 + cat.whiskerAngle * cat.size * 0.1
                    );
                    p.line(
                        i * cat.size * 0.05, cat.size * 0.05,
                        i * cat.size * 0.25, cat.size * 0.05 + cat.whiskerAngle * cat.size * 0.2
                    );
                    p.line(
                        i * cat.size * 0.05, cat.size * 0.05,
                        i * cat.size * 0.25, cat.size * 0.05 + cat.whiskerAngle * cat.size * 0.3
                    );
                }
                p.noStroke();
                
                // Tail
                p.push();
                p.translate(cat.size * 0.4, 0);
                p.rotate(cat.tailAngle);
                p.fill(cat.baseColor);
                p.beginShape();
                p.vertex(0, 0);
                p.bezierVertex(
                    cat.size * 0.2, -cat.size * 0.1,
                    cat.size * 0.3, -cat.size * 0.2,
                    cat.size * 0.4, 0
                );
                p.bezierVertex(
                    cat.size * 0.5, cat.size * 0.2,
                    cat.size * 0.3, cat.size * 0.1,
                    0, 0
                );
                p.endShape();
                p.pop();
                
                p.pop();
            }

            p.mousePressed = () => {
                // Create new cat at mouse position
                if (p.mouseX > 0 && p.mouseX < p.width && p.mouseY > 0 && p.mouseY < p.height) {
                    let newSize = p.random(80, 200);
                    cats.push(createCat(p.mouseX, p.mouseY, newSize));
                    
                    // Limit number of cats
                    if (cats.length > 10) {
                        cats.shift();
                    }
                }
            };

            p.mouseDragged = () => {
                // Move last created cat
                if (cats.length > 0) {
                    let lastCat = cats[cats.length - 1];
                    lastCat.targetX = p.mouseX;
                    lastCat.targetY = p.mouseY;
                    lastCat.isMoving = true;
                }
            };

            p.keyPressed = () => {
                // Clear all cats
                cats = [];
                // Create one new cat in center
                cats.push(createCat(p.width/2, p.height/2, 150));
            };

            p.windowResized = () => {
                p.resizeCanvas(p.min(800, p.windowWidth - 40), p.min(600, p.windowHeight - 40));
            };
        };

        new p5(sketch);
    </script>
